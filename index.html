  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(244,241,232,.55) 0%, rgba(244,241,232,.15) 55%, rgba(244,241,232,0) 80%);
    transition: background .9s ease;
  }
  body.second .bg::after {
    background: radial-gradient(ellipse at center, rgba(244,241,232,.7) 0%, rgba(244,241,232,.25) 55%, rgba(244,241,232,0) 80%);
  }
  @keyframes drift {
    from { transform: scale(1.02) translate3d(-0.6%, -0.4%, 0); }
    to   { transform: scale(1.09) translate3d(0.8%, 0.6%, 0); }
  }

  /* Partikel lembut */
  .motes { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .mote {
    position: absolute; bottom: -20px; border-radius: 60% 40% 60% 40%;
    opacity: 0; filter: blur(.4px);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
    12%  { opacity: .55; }
    85%  { opacity: .4; }
    100% { transform: translate3d(var(--dx), -108vh, 0) rotate(260deg); opacity: 0; }
  }

  .stage {
    position: relative; z-index: 2;
    height: 100%; width: 100%;
    display: grid; place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }

  .page {
    grid-area: 1 / 1;
    max-width: 640px; width: 100%;
    text-align: center;
    padding: clamp(32px, 6vw, 56px) clamp(24px, 5vw, 48px);
    border-radius: 36px 12px 36px 12px;
    background: var(--veil);
    -webkit-backdrop-filter: blur(10px) saturate(1.1);
            backdrop-filter: blur(10px) saturate(1.1);
    box-shadow: 0 20px 60px -25px rgba(70, 85, 60, .35), inset 0 0 0 1px rgba(255,255,255,.5);
    opacity: 0; visibility: hidden;
    transform: translateY(14px) scale(.98);
    filter: blur(8px);
    transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.2,1), filter 1.1s ease, visibility 0s linear 1.1s;
  }
  .page.active {
    opacity: 1; visibility: visible; transform: none; filter: none;
    transition-delay: .35s, .35s, .35s, 0s;
  }

  /* Halaman 1: teks yang bisa diketuk */
  .trigger {
    all: unset; cursor: pointer; display: inline-block;
    font-style: italic; font-weight: 500;
    font-size: clamp(2rem, 6.4vw, 3.4rem);
    line-height: 1.2; letter-spacing: .005em;
    padding: .2em .1em;
    animation: breathe 5.5s ease-in-out infinite;
    transition: color .5s ease, letter-spacing .6s ease;
    background-image: linear-gradient(var(--petal), var(--petal));
    background-repeat: no-repeat; background-position: 50% 100%;
    background-size: 0% 1.5px;
    transition: background-size .7s ease, color .5s ease;
  }
  .trigger:hover, .trigger:focus-visible { background-size: 62% 1.5px; color: #2f3a2d; }
  .trigger:focus-visible { outline: 2px solid var(--moss); outline-offset: 8px; border-radius: 6px; }
  @keyframes breathe {
    0%, 100% { opacity: .92; transform: translateY(0); }
    50%      { opacity: 1;   transform: translateY(-4px); }
  }
  .hint {
    display: block; margin: 22px auto 0; width: 9px; height: 9px; border-radius: 50%;
    background: var(--petal); opacity: .8;
    animation: ping 2.8s ease-out infinite;
  }
  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 rgba(217,139,74,.5); }
    80%, 100% { box-shadow: 0 0 0 16px rgba(217,139,74,0); }
  }

  /* Halaman 2: muncul baris demi baris */
  .line {
    font-size: clamp(1.7rem, 5.2vw, 2.7rem);
    line-height: 1.35; font-weight: 500;
    opacity: 0; transform: translateY(10px); filter: blur(6px);
  }
  .line.soft { font-style: italic; font-weight: 400; margin-top: .5em; color: var(--moss); }
  .page.active .line { animation: settle 1.4s cubic-bezier(.2,.7,.2,1) forwards; }
  .page.active .line:nth-child(1) { animation-delay: .9s; }
  .page.active .line:nth-child(2) { animation-delay: 2.1s; }
  @keyframes settle { to { opacity: 1; transform: none; filter: none; } }

  .back {
    all: unset; cursor: pointer; display: inline-block; margin-top: 30px;
    font-style: italic; font-size: 1.05rem; color: var(--ink); opacity: 0;
    border-bottom: 1px solid transparent; transition: border-color .4s ease;
  }
  .page.active .back { animation: settle 1.2s ease 3.6s forwards; }
  .back:hover, .back:focus-visible { border-bottom-color: var(--petal); }
  .back:focus-visible { outline: 2px solid var(--moss); outline-offset: 6px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .bg, .trigger, .hint, .mote { animation: none !important; }
    .page, .page.active { transition-duration: .01s; transition-delay: 0s; filter: none; }
    .page.active .line, .page.active .back { animation-duration: .01s; animation-delay: 0s !important; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="motes" id="motes" aria-hidden="true"></div>

  <main class="stage">
    <section class="page active" id="p1">
      <button class="trigger" id="go" type="button">Indonesia lagi tidak baik-baik saja</button>
      <span class="hint" aria-hidden="true"></span>
    </section>

    <section class="page" id="p2" aria-live="polite">
      <p class="line">Kalau kabar kamu bagaimana?</p>
      <p class="line soft">Semoga baik-baik saja :)</p>
      <button class="back" id="back" type="button">kembali</button>
    </section>
  </main>

<script>
  (function () {
    var p1 = document.getElementById('p1');
    var p2 = document.getElementById('p2');
    function show(a, b, second) {
      a.classList.remove('active');
      b.classList.add('active');
      document.body.classList.toggle('second', second);
    }
    document.getElementById('go').addEventListener('click', function () { show(p1, p2, true); });
    document.getElementById('back').addEventListener('click', function () { show(p2, p1, false); });

    // Kelopak kecil yang melayang naik pelan-pelan
    var colors = ['#e7b66a', '#d98b4a', '#a9c08f', '#f0d9a8', '#c97a5b'];
    var box = document.getElementById('motes');
    for (var i = 0; i < 16; i++) {
      var m = document.createElement('span');
      var s = 6 + Math.random() * 9;
      m.className = 'mote';
      m.style.cssText =
        'left:' + (Math.random() * 100) + '%;' +
        'width:' + s + 'px;height:' + (s * 1.3) + 'px;' +
        'background:' + colors[i % colors.length] + ';' +
        '--dx:' + ((Math.random() - .5) * 160) + 'px;' +
        'animation-duration:' + (18 + Math.random() * 20) + 's;' +
        'animation-delay:' + (-Math.random() * 30) + 's;';
      box.appendChild(m);
    }
  })();
</script>
</body>
</html>
